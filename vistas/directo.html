<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centro de Directo · Oficina ApliArte</title>
  <link rel="stylesheet" href="/panel-shell.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .directo-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      box-sizing: border-box;
      padding: 0.5rem;
      gap: 0.5rem;
    }
    .directo-bar {
      flex: none;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.55rem 0.9rem;
      background: var(--surface);
      border: 1px solid var(--light);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }
    .directo-bar-title {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--navy);
    }
    html[data-theme="dark"] .directo-bar-title {
      color: var(--cyan);
    }
    .directo-bar-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }
    .directo-frame-box {
      flex: 1;
      min-height: 0;
      border: 1px solid var(--light);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .directo-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div class="directo-shell">
    <div class="directo-bar">
      <div class="directo-bar-title">
        <span>Centro de Directo</span>
        <span class="catalog-tag accent">directo.apliarte.com</span>
      </div>
      <div class="directo-bar-actions">
        <a class="catalog-btn" href="https://directo.apliarte.com/" target="_blank" rel="noopener noreferrer">Abrir en pestaña nueva</a>
        <a class="catalog-btn primary" href="https://twitch.tv/apliarte" target="_blank" rel="noopener noreferrer">Ver canal en Twitch @apliarte</a>
      </div>
    </div>
    <div class="directo-frame-box">
      <iframe class="directo-frame" src="https://directo.apliarte.com/" title="Centro de Directo ApliArte" allow="autoplay; fullscreen; picture-in-picture"></iframe>
    </div>
  </div>

  <script src="/panel-shell.js"></script>
</body>
</html>
