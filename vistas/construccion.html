<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITULO}} · Oficina ApliArte</title>
  <meta name="description" content="Estamos construyendo esta sección. Estará disponible próximamente.">
  <meta property="og:title" content="{{TITULO}} · Oficina ApliArte">
  <meta property="og:description" content="Estamos construyendo esta sección. Estará disponible próximamente.">
  <meta property="og:image" content="/en-construccion.svg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/construccion.css">
</head>
<body data-slug="{{SLUG}}">
  <main class="card">
    <span class="badge">En construcción</span>
    <h1>{{TITULO}}</h1>
    <p class="lead">{{SUBTITULO}}. Estamos construyendo esta sección. Estará disponible próximamente.</p>
    <img class="art" src="/en-construccion.svg" alt="Bot trabajando en un ordenador" width="720" height="480">
    <div class="seg" role="group" aria-label="Qué quieres compartir">
      <button type="button" data-scope="tab" aria-pressed="true">Esta sección</button>
      <button type="button" data-scope="office" aria-pressed="false">Toda la oficina</button>
    </div>
    <div class="share" id="share"></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <a class="back" href="/">Volver a la oficina</a>
  </main>
  <script src="/construccion.js" defer></script>

</html>
