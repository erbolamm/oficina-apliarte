<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Propuestas · Oficina ApliArte</title>
  <link rel="stylesheet" href="../panel-shell.css">
</head>
<body>
  <main class="catalog-wrap">
    <section class="catalog-hero">
      <div>
        <h1>Bandeja de Propuestas</h1>
        <p>Ideas de la comunidad y mejoras propuestas para las aplicaciones y herramientas de ApliArte.</p>
      </div>
      <div style="display:flex; flex-wrap:wrap; align-items:center; gap:0.6rem;">
        <span class="catalog-tag accent" id="prop-count">Cargando...</span>
        <a class="catalog-btn primary" href="https://github.com/erbolamm/oficina-apliarte/issues/new?title=%5BPropuesta%5D%20" target="_blank" rel="noopener noreferrer">Enviar nueva propuesta en GitHub</a>
      </div>
    </section>

    <div class="catalog-controls">
      <input id="prop-search" class="catalog-search" type="search" placeholder="Buscar propuesta por título, aplicación o descripción..." aria-label="Buscar propuesta">
    </div>

    <div id="prop-grid" class="catalog-grid"></div>
  </main>

  <script src="../panel-shell.js"></script>
  <script>
    (function () {
      const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      let items = [];
      let query = "";

      function render() {
        const grid = document.getElementById("prop-grid");
        const count = document.getElementById("prop-count");
        const q = query.trim().toLowerCase();
        const filtered = items.filter((p) => !q || [p.titulo, p.descripcion, p.categoria, p.autor].some((f) => String(f || "").toLowerCase().includes(q)));
        if (count) count.textContent = filtered.length + " propuestas";
        if (!filtered.length) {
          grid.innerHTML = '<div class="catalog-empty">No hay propuestas que coincidan con tu búsqueda.</div>';
          return;
        }
        grid.innerHTML = filtered.map((p) => (
          '<article class="catalog-card">' +
            '<div class="catalog-card-top">' +
              '<div><h2>' + esc(p.titulo || "Sin título") + '</h2><p class="catalog-subtitle">' + esc(p.categoria || "General") + '</p></div>' +
              (p.estado ? '<span class="catalog-tag accent">' + esc(p.estado) + '</span>' : '') +
            '</div>' +
            '<p class="catalog-desc">' + esc(p.descripcion || "") + '</p>' +
            '<div class="catalog-meta">' +
              (p.autor ? '<span class="catalog-tag">' + esc(p.autor) + '</span>' : '') +
              (p.fecha ? '<span class="catalog-tag">' + esc(p.fecha) + '</span>' : '') +
            '</div>' +
          '</article>'
        )).join("");
      }

      document.getElementById("prop-search").addEventListener("input", (e) => {
        query = e.target.value || "";
        render();
      });

      const esEstatico = location.pathname.startsWith("/oficina-apliarte") || location.hostname.endsWith(".github.io");
      const urlPropuestas = esEstatico ? "../datos/propuestas.json?v=" + Date.now() : "/api/propuestas";
      fetch(urlPropuestas, { cache: "no-store" })
        .then((r) => (r.ok ? r : fetch("../datos/propuestas.json?v=" + Date.now(), { cache: "no-store" })))
        .then((r) => (r.ok ? r.json() : []))
        .then((data) => {
          items = Array.isArray(data) ? data : [];
          render();
        })
        .catch(() => {
          document.getElementById("prop-grid").innerHTML = '<div class="catalog-empty">No se pudo cargar la bandeja de propuestas.</div>';
        });
    })();
  </script>
</body>
</html>
