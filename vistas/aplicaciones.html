<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aplicaciones · Oficina ApliArte</title>
  <link rel="stylesheet" href="../panel-shell.css">
</head>
<body>
  <main class="catalog-wrap">
    <section class="catalog-hero">
      <div>
        <h1>Aplicaciones del Ecosistema</h1>
        <p>Catálogo oficial de aplicaciones publicadas y en evolución de ApliArte y ErBolamm.</p>
      </div>
      <span class="catalog-tag accent" id="apps-count">Cargando...</span>
    </section>

    <div class="catalog-controls">
      <input id="apps-search" class="catalog-search" type="search" placeholder="Buscar aplicación por nombre, categoría o descripción..." aria-label="Buscar aplicación">
      <div id="apps-filters" style="display:flex; flex-wrap:wrap; gap:0.45rem;"></div>
    </div>

    <div id="apps-grid" class="catalog-grid"></div>
  </main>

  <script src="../panel-shell.js"></script>
  <script>
    (function () {
      const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      let apps = [];
      let activeCat = "Todas";
      let query = "";

      function render() {
        const grid = document.getElementById("apps-grid");
        const count = document.getElementById("apps-count");
        const filtered = apps.filter((a) => {
          const okCat = activeCat === "Todas" || a.categoria === activeCat;
          const q = query.trim().toLowerCase();
          const okQ = !q || [a.nombre, a.subtitulo, a.descripcion, a.categoria].some((f) => String(f || "").toLowerCase().includes(q));
          return okCat && okQ;
        });
        if (count) count.textContent = filtered.length + " de " + apps.length + " aplicaciones";
        if (!filtered.length) {
          grid.innerHTML = '<div class="catalog-empty">No hay aplicaciones que coincidan con el filtro actual.</div>';
          return;
        }
        grid.innerHTML = filtered.map((a) => {
          const stores = Array.isArray(a.tiendas) ? a.tiendas : [];
          const links = [];
          if (a.enlace_principal && a.enlace_principal.url) {
            links.push('<a class="catalog-btn primary" href="' + esc(a.enlace_principal.url) + '" target="_blank" rel="noopener noreferrer">' + esc(a.enlace_principal.texto || "Web oficial") + '</a>');
          }
          for (const t of stores) {
            if (t && t.url) {
              links.push('<a class="catalog-btn" href="' + esc(t.url) + '" target="_blank" rel="noopener noreferrer">' + esc(t.tienda || t.plataforma || "Tienda") + '</a>');
            }
          }
          const shots = Array.isArray(a.capturas) ? a.capturas : [];
          const iconHtml = a.icono_url
            ? '<img class="catalog-app-icon" src="' + esc(a.icono_url) + '" alt="Icono de ' + esc(a.nombre) + '" loading="lazy" referrerpolicy="no-referrer">'
            : '';
          const shotsHtml = shots.length
            ? '<div class="catalog-shots">' + shots.map((s, i) => '<a class="catalog-shot" href="' + esc(s.replace("=w526-h296-rw", "=w1280")) + '" target="_blank" rel="noopener noreferrer" title="Ampliar captura ' + (i + 1) + '"><img src="' + esc(s) + '" alt="Captura ' + (i + 1) + ' de ' + esc(a.nombre) + '" loading="lazy" referrerpolicy="no-referrer"></a>').join("") + '</div>'
            : '';
          const versionHtml = (a.version && /^\d/.test(String(a.version).trim()) ? '<span class="catalog-tag accent">v' + esc(String(a.version).trim()) + '</span>' : (a.version ? '<span class="catalog-tag accent">' + esc(a.version) + '</span>' : ''));
          const issueUrl = 'https://github.com/erbolamm/oficina-apliarte/issues/new?title=' +
            encodeURIComponent('[Propuesta] ' + a.nombre + ': ') +
            '&body=' + encodeURIComponent('### Contexto del apartado\n- **Aplicación**: ' + a.nombre + '\n- **Categoría**: ' + (a.categoria || '') + '\n- **Estado**: ' + (a.estado || 'Disponible') + '\n\n### ¿Qué te gustaría comentar, proponer o mejorar?\n');
          return (
            '<article class="catalog-card">' +
              '<div class="catalog-card-top">' +
                '<div class="catalog-app-head">' +
                  iconHtml +
                  '<div><h2>' + esc(a.nombre) + '</h2><p class="catalog-subtitle">' + esc(a.subtitulo || "") + '</p></div>' +
                '</div>' +
                '<div style="display:flex; align-items:center; gap:0.4rem;">' +
                  versionHtml +
                  '<a class="btn-contextual-feedback inline-feedback-btn" href="' + esc(issueUrl) + '" target="_blank" rel="noopener noreferrer" title="Comentar o proponer una idea sobre ' + esc(a.nombre) + '" aria-label="Comentar o proponer una idea sobre ' + esc(a.nombre) + '">' +
                    '<svg class="feedback-icon-svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="12" y1="8" x2="12" y2="14"/><line x1="9" y1="11" x2="15" y2="11"/></svg>' +
                  '</a>' +
                '</div>' +
              '</div>' +
              '<p class="catalog-desc">' + esc(a.descripcion || "") + '</p>' +
              shotsHtml +
              '<div class="catalog-meta">' +
                (a.categoria ? '<span class="catalog-tag">' + esc(a.categoria) + '</span>' : '') +
                (a.estado ? '<span class="catalog-tag">' + esc(a.estado) + '</span>' : '') +
              '</div>' +
              (links.length ? '<div class="catalog-actions">' + links.join("") + '</div>' : '') +
            '</article>'
          );
        }).join("");
      }

      function renderFilters() {
        const box = document.getElementById("apps-filters");
        const cats = ["Todas", ...new Set(apps.map((a) => a.categoria).filter(Boolean))];
        box.innerHTML = cats.map((c) => '<button type="button" class="catalog-pill' + (c === activeCat ? ' active' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>').join("");
        box.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeCat = btn.dataset.cat || "Todas";
            renderFilters();
            render();
          });
        });
      }

      document.getElementById("apps-search").addEventListener("input", (e) => {
        query = e.target.value || "";
        render();
      });

      const esEstatico = location.pathname.startsWith("/oficina-apliarte") || location.hostname.endsWith(".github.io");
      const urlApps = esEstatico ? "../datos/aplicaciones.json?v=" + Date.now() : "/api/aplicaciones";
      fetch(urlApps, { cache: "no-store" })
        .then((r) => (r.ok ? r : fetch("../datos/aplicaciones.json?v=" + Date.now(), { cache: "no-store" })))
        .then((r) => (r.ok ? r.json() : []))
        .then((data) => {
          apps = Array.isArray(data) ? data : [];
          renderFilters();
          render();
        })
        .catch(() => {
          document.getElementById("apps-grid").innerHTML = '<div class="catalog-empty">No se pudo cargar el catálogo de aplicaciones.</div>';
        });
    })();
  </script>
</body>
</html>
