<svg width="720" height="480" viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform { display: none; }
    }
    .primary { fill: #005fa9; }
    .accent { fill: #5ecef5; }
    .neutral-1 { fill: #ffffff; }
    .neutral-2 { fill: #dde2e8; }
    .neutral-3 { fill: #c5cdd8; }
    .neutral-4 { fill: #b0bac7; }
    .bg { fill: #f6f5f0; }
    .border { stroke: #182230; stroke-width: 1.25; }
  </style>

  <rect width="100%" height="100%" class="bg" />

  <!-- Escritorio isometrico -->
  <g transform="translate(100,320)">
    <rect x="0" y="0" width="520" height="100" class="primary" rx="15" />

    <!-- Monitor con lineas de codigo -->
    <g transform="translate(40, -180)">
      <rect x="0" y="0" width="480" height="200" class="neutral-1" rx="10" />
      <g transform="translate(40, 40)">
        <path d="M 0 20 L 180 20" class="neutral-3 border" />
        <path d="M 0 40 L 180 40" class="neutral-4 border" />
        <path d="M 0 60 L 120 60" class="neutral-4 border" />
        <path d="M 0 80 L 180 80" class="neutral-3 border" />
        <path d="M 60 100 L 180 100" class="neutral-2 border" />
        <path d="M 0 120 L 140 120" class="neutral-3 border" />
      </g>
    </g>

    <!-- Bot pequeño -->
    <g transform="translate(220, -140)">
      <circle cx="0" cy="0" r="20" class="primary" />
      <circle cx="-8" cy="-5" r="4" class="neutral-3" />
      <circle cx="8" cy="-5" r="4" class="neutral-3" />

      <!-- Brazo izquierdo (digitando) -->
      <g transform="translate(0, 60)">
        <line x1="0" y1="-20" x2="0" y2="60" class="border">
          <animateTransform attributeName="transform" type="rotate"
            values="0 0 0; 10 0 0" dur="3.2s" repeatCount="indefinite" additive="sum" />
        </line>
      </g>

      <!-- Brazo derecho -->
      <g transform="translate(40, 60)">
        <line x1="0" y1="-20" x2="0" y2="60" class="border">
          <animateTransform attributeName="transform" type="rotate"
            values="0 0 0; -10 0 0" dur="3.2s" repeatCount="indefinite" additive="sum" />
        </line>
      </g>

      <!-- Cursor parpadeante -->
      <g transform="translate(-20, 80)">
        <circle cx="0" cy="0" r="8" class="neutral-1">
          <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0s" repeatCount="indefinite" />
        </circle>
      </g>

      <!-- Chispas flotantes -->
      <g transform="translate(0, 60)">
        <circle cx="-25" cy="-20" r="4" class="neutral-1">
          <animateTransform attributeName="transform" type="translate"
            values="0 0; 0 -10; 0 0" dur="3.6s" repeatCount="indefinite" additive="sum" />
        </circle>
      </g>
      <g transform="translate(60, 60)">
        <circle cx="0" cy="-20" r="4" class="neutral-1">
          <animateTransform attributeName="transform" type="translate"
            values="0 0; 0 -10; 0 0" dur="3.6s" repeatCount="indefinite" additive="sum" />
        </circle>
      </g>
    </g>
  </g>
</svg>