<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paquetes Flutter · Oficina ApliArte</title>
  <link rel="stylesheet" href="/panel-shell.css">
</head>
<body>
  <main class="catalog-wrap">
    <section class="catalog-hero">
      <div>
        <h1>Paquetes y Librerías Flutter</h1>
        <p>Componentes abiertos de conectividad, control remoto y síntesis de voz del ecosistema ApliArte.</p>
      </div>
      <span class="catalog-tag accent" id="pkg-count">Cargando...</span>
    </section>

    <div class="catalog-controls">
      <input id="pkg-search" class="catalog-search" type="search" placeholder="Buscar paquete por nombre, plataforma o descripción..." aria-label="Buscar paquete">
    </div>

    <div id="pkg-grid" class="catalog-grid"></div>
  </main>

  <script src="/panel-shell.js"></script>
  <script>
    (function () {
      const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      let items = [];
      let query = "";

      function copyText(text, btn) {
        const done = () => {
          const orig = btn.textContent;
          btn.textContent = "Copiado";
          setTimeout(() => { btn.textContent = orig; }, 1600);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(done);
        } else {
          done();
        }
      }

      function render() {
        const grid = document.getElementById("pkg-grid");
        const count = document.getElementById("pkg-count");
        const q = query.trim().toLowerCase();
        const filtered = items.filter((p) => !q || [p.nombre, p.subtitulo, p.descripcion, p.tipo].some((f) => String(f || "").toLowerCase().includes(q)));
        if (count) count.textContent = filtered.length + " de " + items.length + " paquetes";
        if (!filtered.length) {
          grid.innerHTML = '<div class="catalog-empty">No hay paquetes que coincidan con tu búsqueda.</div>';
          return;
        }
        grid.innerHTML = filtered.map((p, idx) => {
          const plats = Array.isArray(p.plataformas) ? p.plataformas.map((pl) => '<span class="catalog-tag">' + esc(pl) + '</span>').join("") : "";
          const install = p.instalacion || ("dependencies:\n  " + p.nombre + ": ^" + (p.version || "0.1.0"));
          return (
            '<article class="catalog-card">' +
              '<div class="catalog-card-top">' +
                '<div><h2>' + esc(p.nombre) + '</h2><p class="catalog-subtitle">' + esc(p.subtitulo || p.tipo || "") + '</p></div>' +
                (p.version ? '<span class="catalog-tag accent">v' + esc(p.version) + '</span>' : '') +
              '</div>' +
              '<p class="catalog-desc">' + esc(p.descripcion || "") + '</p>' +
              '<div class="catalog-meta">' + plats + (p.licencia ? '<span class="catalog-tag">' + esc(p.licencia) + '</span>' : '') + '</div>' +
              '<pre class="catalog-code">' + esc(install) + '</pre>' +
              '<div class="catalog-actions">' +
                (p.repositorio ? '<a class="catalog-btn primary" href="' + esc(p.repositorio) + '" target="_blank" rel="noopener noreferrer">Ver repositorio en GitHub</a>' : '') +
                '<button type="button" class="catalog-btn copy-btn" data-idx="' + idx + '">Copiar instalación</button>' +
              '</div>' +
            '</article>'
          );
        }).join("");

        grid.querySelectorAll(".copy-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const p = filtered[Number(btn.dataset.idx)];
            const install = p.instalacion || ("dependencies:\n  " + p.nombre + ": ^" + (p.version || "0.1.0"));
            copyText(install, btn);
          });
        });
      }

      document.getElementById("pkg-search").addEventListener("input", (e) => {
        query = e.target.value || "";
        render();
      });

      fetch("/api/paquetes", { cache: "no-store" })
        .then((r) => (r.ok ? r.json() : []))
        .then((data) => {
          items = Array.isArray(data) ? data : [];
          render();
        })
        .catch(() => {
          document.getElementById("pkg-grid").innerHTML = '<div class="catalog-empty">No se pudo cargar el catálogo de paquetes.</div>';
        });
    })();
  </script>
</body>
</html>
