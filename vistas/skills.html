<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habilidades y Skills · Oficina ApliArte</title>
  <link rel="stylesheet" href="../panel-shell.css">
</head>
<body>
  <main class="catalog-wrap">
    <section class="catalog-hero">
      <div>
        <h1>Catálogo de Habilidades (Skills)</h1>
        <p>Protocolos canónicos compartidos por todos los orquestadores y motores de trabajo de ApliArte en modo solo lectura.</p>
      </div>
      <span class="catalog-tag accent" id="skills-count">Cargando...</span>
    </section>

    <div class="catalog-controls">
      <input id="skills-search" class="catalog-search" type="search" placeholder="Buscar entre las habilidades por nombre, gatillo o propósito..." aria-label="Buscar habilidad">
      <div id="skills-highlights" style="display:flex; flex-wrap:wrap; gap:0.4rem;"></div>
    </div>

    <div id="skills-grid" class="catalog-grid"></div>
  </main>

  <script src="../panel-shell.js"></script>
  <script>
    (function () {
      const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      let items = [];
      let query = "";

      function render() {
        const grid = document.getElementById("skills-grid");
        const count = document.getElementById("skills-count");
        const q = query.trim().toLowerCase();
        const filtered = items.filter((s) => !q || [s.nombre, s.descripcion, s.ruta_relativa].some((f) => String(f || "").toLowerCase().includes(q)));
        if (count) count.textContent = filtered.length + " de " + items.length + " habilidades";
        if (!filtered.length) {
          grid.innerHTML = '<div class="catalog-empty">No hay habilidades que coincidan con tu búsqueda.</div>';
          return;
        }
        grid.innerHTML = filtered.map((s) => {
          const issueUrl = 'https://github.com/erbolamm/oficina-apliarte/issues/new?title=' +
            encodeURIComponent('[Propuesta] Skill /' + s.nombre + ': ') +
            '&body=' + encodeURIComponent('### Contexto del apartado\n- **Skill**: /' + s.nombre + '\n- **Ruta**: ' + (s.ruta_relativa || '') + '\n- **Estado**: Activa\n\n### ¿Qué te gustaría comentar, proponer o mejorar?\n');
          return (
            '<article class="catalog-card">' +
              '<div class="catalog-card-top">' +
                '<div><h2>/' + esc(s.nombre) + '</h2><p class="catalog-subtitle">' + esc(s.ruta_relativa || "") + '</p></div>' +
                '<div style="display:flex; align-items:center; gap:0.4rem;">' +
                  '<span class="catalog-tag accent">Activa</span>' +
                  '<a class="btn-contextual-feedback inline-feedback-btn" href="' + esc(issueUrl) + '" target="_blank" rel="noopener noreferrer" title="Comentar o proponer una idea sobre la skill /' + esc(s.nombre) + '" aria-label="Comentar o proponer una idea sobre la skill /' + esc(s.nombre) + '">' +
                    '<svg class="feedback-icon-svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="12" y1="8" x2="12" y2="14"/><line x1="9" y1="11" x2="15" y2="11"/></svg>' +
                  '</a>' +
                '</div>' +
              '</div>' +
              '<p class="catalog-desc">' + esc(s.descripcion || "") + '</p>' +
              '<div class="catalog-actions">' +
                '<button type="button" class="catalog-btn primary copy-skill" data-name="/' + esc(s.nombre) + '">Copiar comando /' + esc(s.nombre) + '</button>' +
              '</div>' +
            '</article>'
          );
        }).join("");

        grid.querySelectorAll(".copy-skill").forEach((btn) => {
          btn.addEventListener("click", () => {
            const cmd = btn.dataset.name || "";
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(cmd).catch(() => {});
            }
            const orig = btn.textContent;
            btn.textContent = "Comando copiado";
            setTimeout(() => { btn.textContent = orig; }, 1600);
          });
        });
      }

      document.getElementById("skills-search").addEventListener("input", (e) => {
        query = e.target.value || "";
        render();
      });

      function renderHighlights(list) {
        const box = document.getElementById("skills-highlights");
        if (!box || !Array.isArray(list) || !list.length) return;
        box.innerHTML = list.map((h) => '<button type="button" class="catalog-pill" data-q="' + esc(h.split(" ")[0]) + '">' + esc(h) + '</button>').join("");
        box.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            const input = document.getElementById("skills-search");
            query = btn.dataset.q || "";
            if (input) input.value = query;
            render();
          });
        });
      }

      fetch("../datos/habilidades.json?v=" + Date.now(), { cache: "no-store" })
        .then((r) => (r.ok ? r.json() : null))
        .then((data) => {
          if (data && Array.isArray(data.habilidades) && data.habilidades.length > 0) {
            return data;
          }
          if (location.pathname.startsWith("/oficina-apliarte") || location.hostname.endsWith(".github.io")) {
            return {};
          }
          return fetch("/api/habilidades", { cache: "no-store" }).then((r) => (r.ok ? r.json() : {}));
        })
        .then((data) => {
          items = Array.isArray(data && data.habilidades) ? data.habilidades : [];
          renderHighlights(data && data.herramientas_destacadas);
          render();
        })
        .catch(() => {
          document.getElementById("skills-grid").innerHTML = '<div class="catalog-empty">No se pudo cargar el catálogo de habilidades.</div>';
        });
    })();
  </script>
</body>
</html>
