<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="180" height="180">
  <defs>
    <radialGradient id="charOrange" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff9944"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
    <radialGradient id="charBelly" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#ffe082"/>
    </radialGradient>
    <radialGradient id="charFlame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffff00"/>
      <stop offset="60%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#d50000"/>
    </radialGradient>
  </defs>
  <!-- Cola -->
  <path d="M 130 135 C 165 140 180 110 165 85" fill="none" stroke="url(#charOrange)" stroke-width="16" stroke-linecap="round"/>
  <!-- Llama de la cola -->
  <path d="M 165 85 C 150 65 165 40 180 50 C 195 40 185 75 165 85 Z" fill="url(#charFlame)"/>
  <!-- Cuerpo -->
  <ellipse cx="100" cy="125" rx="45" ry="48" fill="url(#charOrange)" stroke="#bf360c" stroke-width="3"/>
  <!-- Barriga amarilla -->
  <ellipse cx="96" cy="130" rx="30" ry="36" fill="url(#charBelly)"/>
  <!-- Cabeza -->
  <ellipse cx="100" cy="72" rx="38" ry="34" fill="url(#charOrange)" stroke="#bf360c" stroke-width="3"/>
  <!-- Ojos alegres de Charmander -->
  <ellipse cx="85" cy="68" rx="8" ry="12" fill="#ffffff" stroke="#bf360c" stroke-width="2"/>
  <ellipse cx="86" cy="68" rx="5" ry="8" fill="#0288d1"/>
  <ellipse cx="85" cy="65" rx="2" ry="3" fill="#ffffff"/>
  <ellipse cx="118" cy="68" rx="8" ry="12" fill="#ffffff" stroke="#bf360c" stroke-width="2"/>
  <ellipse cx="117" cy="68" rx="5" ry="8" fill="#0288d1"/>
  <ellipse cx="116" cy="65" rx="2" ry="3" fill="#ffffff"/>
  <!-- Hocico y sonrisa -->
  <path d="M 90 85 Q 102 96 114 85" fill="none" stroke="#bf360c" stroke-width="3" stroke-linecap="round"/>
  <!-- Dientecito -->
  <polygon points="94,86 98,86 96,90" fill="#ffffff"/>
  <!-- Patitas -->
  <ellipse cx="75" cy="165" rx="14" ry="10" fill="url(#charOrange)" stroke="#bf360c" stroke-width="3"/>
  <ellipse cx="125" cy="165" rx="14" ry="10" fill="url(#charOrange)" stroke="#bf360c" stroke-width="3"/>
  <!-- Bracitos -->
  <ellipse cx="70" cy="115" rx="10" ry="8" fill="url(#charOrange)" stroke="#bf360c" stroke-width="3"/>
  <ellipse cx="130" cy="115" rx="10" ry="8" fill="url(#charOrange)" stroke="#bf360c" stroke-width="3"/>
</svg>
