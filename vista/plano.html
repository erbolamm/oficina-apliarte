<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#005fa9">
  <title>Oficina · Plano operativo</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23005fa9%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2248%22%20font-size%3D%2242%22%20font-family%3D%22system-ui%2C%20-apple-system%2C%20sans-serif%22%20font-weight%3D%22bold%22%20text-anchor%3D%22middle%22%20fill%3D%22%235ecef5%22%3E%E2%8C%82%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../panel-shell.css">
  <link rel="stylesheet" href="/office-3d.css">
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("erbolamm-panel-theme") === "dark" ? "dark" : "light";
    } catch (_) {}
  </script>
</head>
<body class="plano-standalone-body">
  <header class="topbar plano-topbar" id="casita">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <polygon points="20,4 28,12 4,36 4,20" fill="#0061aa"/>
        <polygon points="20,4 12,12 36,36 36,20" fill="#59d4fd" opacity="0.9"/>
      </svg>
      <h1>Oficina · Plano operativo</h1>
    </div>
    <span class="private-chip">Ventana independiente</span>
    <span class="connection" id="connection" data-kind="loading">Conectando</span>
    <button id="refresh-btn" class="btn-refresh" type="button" onclick="window.location.reload()" aria-label="Actualizar vista" title="Actualizar">↻</button>
    <button id="theme-toggle" type="button" aria-label="Activar modo oscuro" title="Cambiar tema">
      <span id="theme-icon" aria-hidden="true">☾</span>
    </button>
    <a href="/" class="panel-action-btn back-office-link" title="Volver a la oficina completa">⌂ Oficina principal</a>
  </header>

  <p class="updated" id="updated" hidden>Esperando la primera lectura</p>

  <main class="office-content plano-standalone-content" id="office">
    <section class="panel map-panel" id="map-panel" aria-labelledby="office-3d-title">
      <div class="panel-head">
        <div class="panel-head-title">
          <h2 id="office-3d-title">Oficina · Plano operativo</h2>
          <p>Personajes, muebles y encargos conectados al tablero real en tiempo real.</p>
        </div>
        <div class="panel-head-actions">
          <div class="view-mode-group" role="group" aria-label="Cambiar vista del plano">
            <button type="button" id="btn-view-3d" class="panel-action-btn view-btn active" data-view="3d" title="Plano 3D isométrico">
              <span class="view-icon" aria-hidden="true">🧊</span> Plano 3D
            </button>
            <button type="button" id="btn-view-2d" class="panel-action-btn view-btn" data-view="diorama" title="Plano 2D diorama">
              <span class="view-icon" aria-hidden="true">🗺️</span> Plano 2D
            </button>
            <button type="button" id="btn-view-radar" class="panel-action-btn view-btn" data-view="radar" title="Radar elástico de nodos">
              <span class="view-icon" aria-hidden="true">◎</span> Radar
            </button>
          </div>
        </div>
      </div>
      <div id="office-3d" data-fill="1"><p>Cargando la oficina CSS 3D…</p></div>
    </section>
  </main>

  <p class="sr-only" id="announcer" aria-live="polite"></p>

  <template id="task-template">
    <li class="task-card">
      <div class="task-head">
        <span class="role-pill"></span>
        <span class="task-project"></span>
      </div>
      <a class="task-title" href=""></a>
      <p class="task-meta"></p>
    </li>
  </template>

  <script src="../panel-shell.js"></script>
  <script src="/office-3d.js"></script>
</body>
</html>
