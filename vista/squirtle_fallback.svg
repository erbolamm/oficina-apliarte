      <stop offset="0%" stop-color="#80deea"/>
      <stop offset="100%" stop-color="#00acc1"/>
    </radialGradient>
    <radialGradient id="sqShell" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#d7ccc8"/>
