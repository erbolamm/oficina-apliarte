<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="180" height="180">
  <defs>
    <radialGradient id="pikaYellow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </radialGradient>
  </defs>
  <!-- Cola de rayo detrás -->
  <polygon points="120,130 145,115 135,100 165,80 155,65 185,45 165,100 145,110 150,135 125,140" fill="#fbc02d" stroke="#f57f17" stroke-width="3"/>
  <!-- Orejas con puntas negras -->
  <polygon points="65,65 35,15 50,45" fill="url(#pikaYellow)" stroke="#f57f17" stroke-width="3"/>
  <polygon points="35,15 42,28 50,45" fill="#212121"/>
  <polygon points="135,65 165,15 150,45" fill="url(#pikaYellow)" stroke="#f57f17" stroke-width="3"/>
  <polygon points="165,15 158,28 150,45" fill="#212121"/>
  <!-- Cuerpo redondito -->
  <ellipse cx="100" cy="125" rx="44" ry="46" fill="url(#pikaYellow)" stroke="#f57f17" stroke-width="3"/>
  <!-- Cabeza alegre -->
  <ellipse cx="100" cy="78" rx="38" ry="32" fill="url(#pikaYellow)" stroke="#f57f17" stroke-width="3"/>
  <!-- Ojos negros con brillo -->
  <ellipse cx="85" cy="72" rx="7" ry="9" fill="#212121"/>
  <ellipse cx="83" cy="69" rx="3" ry="4" fill="#ffffff"/>
  <ellipse cx="115" cy="72" rx="7" ry="9" fill="#212121"/>
  <ellipse cx="113" cy="69" rx="3" ry="4" fill="#ffffff"/>
  <!-- Naricita -->
  <polygon points="98,80 102,80 100,83" fill="#212121"/>
  <!-- Mofletes rojos eléctricos -->
  <circle cx="72" cy="85" r="9" fill="#e53935"/>
  <circle cx="128" cy="85" r="9" fill="#e53935"/>
  <!-- Boquita sonriente -->
  <path d="M 94 88 Q 100 95 106 88" fill="none" stroke="#212121" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Patitas -->
  <ellipse cx="75" cy="165" rx="14" ry="8" fill="url(#pikaYellow)" stroke="#f57f17" stroke-width="3"/>
  <ellipse cx="125" cy="165" rx="14" ry="8" fill="url(#pikaYellow)" stroke="#f57f17" stroke-width="3"/>
  <!-- Bracitos saludando -->
  <ellipse cx="80" cy="120" rx="9" ry="12" fill="url(#pikaYellow)" stroke="#f57f17" stroke-width="2"/>
  <ellipse cx="120" cy="120" rx="9" ry="12" fill="url(#pikaYellow)" stroke="#f57f17" stroke-width="2"/>
</svg>
