<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Oficina · overlay</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23005fa9%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2248%22%20font-size%3D%2242%22%20font-family%3D%22system-ui%2C%20-apple-system%2C%20sans-serif%22%20font-weight%3D%22bold%22%20text-anchor%3D%22middle%22%20fill%3D%22%235ecef5%22%3E%E2%8C%82%3C/text%3E%3C/svg%3E">
  <!-- Vista sola del plano para OBS. Sin barra lateral, sin tablero y sin
       buzón: solo la oficina, a pantalla completa y con fondo transparente,
       para añadirla en OBS como «Fuente de navegador».

       Modo relleno: `data-fill="1"` hace que el plano use el alto disponible
       completo (el panel normal lo deja en 650 px). -->
  <link rel="stylesheet" href="/office-3d.css?v=20260924-1218">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      /* Fondo transparente: en OBS se ve lo que haya debajo del recuadro.
         Para un color plano, cambia «transparent» por el que quieras. */
      background: transparent;
      overflow: hidden;
    }
    #office-3d { position: fixed; inset: 0; display: flex; }
    /* Cadena de alturas definidas para que el plano llene el recuadro. */
    #office-3d > .real-office { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    #office-3d .office-volume { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    #office-3d .volume-viewport { flex: 1 1 auto; min-height: 0; }
    /* Solo el plano: fuera los botones de alrededor y la tira de agentes. */
    #office-3d .camera-tools { display: none; }
    #office-3d .office-roster { display: none; }
  </style>
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("erbolamm-panel-theme") === "dark" ? "dark" : "light";
    } catch (_) {}
  </script>
</head>
<body>
  <!--
    Vistas soportadas en esta URL:
      · /vista/oficina               → plano completo de la oficina (real).
      · /vista/oficina?demo=1        → escena low-poly 3D (demo R3F, encargo 2026-09-15).
      · /vista/oficina?agent=ID     → popup de un agente (lo abre main.tsx).

    El selector `?demo=1` NO requiere servidor adicional ni cambia puertos.
    Si la demo no convence, basta con borrar `src/demo-lowpoly.tsx` y la
    línea `else if (params.get('demo')==='1') ...` en `src/main.tsx`.
  -->
  <main id="office-3d" data-fill="1" aria-label="Plano de la oficina"></main>
  <script src="../panel-shell.js?v=20260924-1218"></script>
  <script src="/office-3d.js?v=20260924-1218"></script>
</body>
</html>
