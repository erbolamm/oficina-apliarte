<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="180" height="180">
  <defs>
    <radialGradient id="mimiCloth" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fdf6d8"/>
      <stop offset="60%" stop-color="#ece2bb"/>
      <stop offset="100%" stop-color="#d4c599"/>
    </radialGradient>
    <linearGradient id="stickWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#5d4037"/>
    </linearGradient>
  </defs>

  <!-- Sombra misteriosa de fantasma en la base -->
  <ellipse cx="100" cy="172" rx="42" ry="10" fill="#1e1b4b" opacity="0.4"/>

  <!-- Cola de palo de madera detrás -->
  <path d="M 125 150 L 148 135 L 140 120 L 168 95 L 158 80 L 182 60 L 165 110 L 146 122 L 152 148 Z" fill="url(#stickWood)" stroke="#3e2723" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Oreja izquierda recta con punta negra -->
  <polygon points="68,68 40,18 55,50" fill="url(#mimiCloth)" stroke="#bfa670" stroke-width="2.5"/>
  <polygon points="40,18 46,30 55,50" fill="#2d2d2d"/>

  <!-- Oreja derecha doblada y caída -->
  <path d="M 128 65 Q 150 45 162 60 Q 155 78 138 72 Z" fill="url(#mimiCloth)" stroke="#bfa670" stroke-width="2.5"/>
  <path d="M 152 52 Q 162 60 155 78 Q 148 75 145 62 Z" fill="#2d2d2d"/>

  <!-- Cuerpo de saco de tela con dobladillo andrajoso -->
  <path d="M 68 110 C 60 140 55 165 62 168 C 72 170 80 162 90 168 C 100 172 110 162 120 168 C 130 172 140 162 148 166 C 152 162 144 135 135 110 Z" fill="url(#mimiCloth)" stroke="#bfa670" stroke-width="2.5"/>

  <!-- Cabeza de saco suavemente deformada -->
  <path d="M 68 85 C 65 60 78 45 100 45 C 122 45 136 60 134 85 C 132 105 120 115 100 115 C 80 115 70 105 68 85 Z" fill="url(#mimiCloth)" stroke="#bfa670" stroke-width="2.5"/>

  <!-- Cara dibujada con ceras/rotulador por Mimikyu -->
  <!-- Ojos garabateados -->
  <ellipse cx="85" cy="74" rx="7" ry="8" fill="#1f2937" transform="rotate(-6 85 74)"/>
  <ellipse cx="115" cy="74" rx="7" ry="8" fill="#1f2937" transform="rotate(8 115 74)"/>

  <!-- Mofletes coloreados de naranja/rojo garabateados -->
  <circle cx="72" cy="88" r="8" fill="#f97316" opacity="0.85"/>
  <circle cx="128" cy="88" r="8" fill="#f97316" opacity="0.85"/>

  <!-- Boca en zig-zag garabateada -->
  <path d="M 90 92 L 95 97 L 100 91 L 105 97 L 110 92" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ojos verdaderos de Mimikyu asomando por la parte baja del saco -->
  <ellipse cx="90" cy="152" rx="4" ry="2.5" fill="#facc15"/>
  <ellipse cx="110" cy="152" rx="4" ry="2.5" fill="#facc15"/>
</svg>